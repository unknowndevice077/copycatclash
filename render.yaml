# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker web service that serves the API, Socket.IO and the built client.
# Free plan: no persistent disk, so the SQLite data is temporary. For permanent data, switch to
# `plan: starter` and add a `disk:` mounted at /app/server/data.
services:
  - type: web
    name: copy-cat-clash
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # No card needed. Data (players, ranks, history) resets when the service restarts or sleeps.
    region: oregon
    numInstances: 1          # Live matches are in memory; scale out only with Redis (see README).
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false          # Enter it in the Render dashboard; never commit it.
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: PHOTO_PROVIDER
        value: local
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false          # e.g. https://copy-cat-clash.onrender.com (same-origin play works without it)
      - key: MAX_CONN_PER_IP
        value: "12"
